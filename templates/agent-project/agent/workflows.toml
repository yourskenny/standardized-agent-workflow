schema_version = "workflow.v2"

[[workflows]]
id = "rag_qa"
description = "Source-backed question answering over the project knowledge base."
requires_sources = true
terminal_steps = ["build_policy_response", "build_response"]
steps = [
  "prepare_retrieval_query",
  "run_retrieval",
  "apply_policy",
  "build_policy_response",
  "generate_answer",
  "build_response",
]

[[workflows]]
id = "retrieval_debug"
description = "Return ranked retrieval evidence without generation."
requires_sources = false
terminal_steps = ["build_retrieval_debug_response"]
steps = [
  "prepare_retrieval_query",
  "run_retrieval",
  "build_retrieval_debug_response",
]

[[workflows]]
id = "refusal_with_guidance"
description = "Refuse out-of-bound requests and offer allowed alternatives."
requires_sources = false
terminal_steps = ["build_policy_response"]
steps = [
  "apply_policy",
  "build_policy_response",
]
