[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-agent"
version = "0.1.0"
description = "Dependency-light local RAG agent runtime for standardized agent projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Standardized Agent Workflow Maintainers" },
]
dependencies = []

[project.scripts]
local-rag-agent = "local_rag_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_rag_agent*"]
